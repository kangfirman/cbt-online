<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin — CBT Online</title>
  <link rel="stylesheet" href="../assets/css/tokens.css"/>
  <link rel="stylesheet" href="../assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#0b1326", surface: "#0b1326", "surface-container": "#171f33",
            "surface-container-high": "#222a3d", "on-surface": "#dae2fd",
            "on-surface-variant": "#c2c6d6", primary: "#adc6ff", "on-primary": "#002e6a",
            tertiary: "#4edea3", error: "#ffb4ab"
          },
          fontFamily: { display: ["Space Grotesk"], body: ["Atkinson Hyperlegible Next"] }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-surface-container rounded-xl p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="w-16 h-16 bg-surface-container-high rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <span class="material-symbols-outlined text-[32px] text-primary">admin_panel_settings</span>
      </div>
      <h1 class="font-display text-2xl font-bold tracking-tight mb-2">Admin Portal</h1>
      <p class="text-on-surface-variant text-sm">Masuk dengan Email & Password</p>
    </div>

    <form id="login-form" class="flex flex-col gap-4 relative z-10">
      <div>
        <label class="block text-sm font-bold text-on-surface-variant mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-surface-container-lowest border border-surface-container-high rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="admin@sekolah.id">
      </div>
      <div>
        <label class="block text-sm font-bold text-on-surface-variant mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-surface-container-lowest border border-surface-container-high rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="••••••••">
      </div>
      
      <p id="error-msg" class="hidden text-error text-sm text-center bg-error/10 p-2 rounded w-full"></p>

      <button type="submit" id="btn-login" class="w-full bg-primary text-on-primary font-bold py-3 rounded-lg mt-2 hover:brightness-110 transition flex justify-center items-center gap-2">
        <span class="material-symbols-outlined text-[20px]">login</span> Masuk
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-on-surface-variant relative z-10 border-t border-surface-container-high pt-4">
      <p>Khusus Guru & Administrator.</p>
      <a href="../index.html" class="text-primary hover:underline mt-2 inline-block">Kembali ke Login Siswa</a>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');

      btn.style.opacity = '0.5';
      btn.disabled = true;
      errEl.classList.add('hidden');

      try {
        const data = await API.call('loginAdmin', { email, password });
        API.setToken(data.sessionToken);
        API.setUser(data.user);
        location.href = 'dashboard.html';
      } catch (err) {
        btn.style.opacity = '1';
        btn.disabled = false;
        errEl.textContent = err.message || 'Login gagal';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
