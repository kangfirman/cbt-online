<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Live Monitoring — CBT Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css"/><link rel="stylesheet" href="../assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { background: "#0b1326", surface: "#0b1326", "surface-container-lowest": "#060e20", "surface-container-low": "#131b2e", "surface-container": "#171f33", "surface-container-high": "#222a3d", "on-surface": "#dae2fd", "on-surface-variant": "#c2c6d6", primary: "#adc6ff", "on-primary": "#002e6a", secondary: "#a4c9ff", tertiary: "#4edea3", error: "#ffb4ab" }, fontFamily: { display: ["Space Grotesk"], body: ["Atkinson Hyperlegible Next"] } } } }</script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen antialiased">
  <header class="fixed top-0 w-full h-16 bg-surface-container-lowest border-b border-surface-container-high z-50 flex items-center justify-between px-6">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2"><span class="material-symbols-outlined text-primary text-[28px]">admin_panel_settings</span><span class="font-display font-bold text-lg tracking-tight">CBT Admin</span></div>
      <nav class="hidden md:flex gap-4" id="nav-links">
        <a href="dashboard.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Dashboard</a>
        <a href="bank-soal.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Bank Soal</a>
        <a href="ujian.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Ujian</a>
        <a href="hasil.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Hasil</a>
        <a href="monitoring.html" class="text-sm font-bold text-primary">Monitoring</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="Auth.logout()" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-error/20 hover:text-error transition"><span class="material-symbols-outlined text-[18px]">logout</span></button>
    </div>
  </header>

  <main class="pt-24 px-6 pb-12 max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
      <div>
        <h1 class="font-display text-2xl font-bold flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-tertiary animate-ping"></span> Live Monitoring</h1>
        <p class="text-sm text-on-surface-variant">Pantau progress siswa secara real-time (Auto-refresh 10 detik).</p>
      </div>
      <select id="select-exam" class="bg-surface-container border border-surface-container-high rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-primary" onchange="startMonitoring(this.value)">
        <option value="">-- Pilih Ujian Aktif --</option>
      </select>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="monitoring-stats">
      <!-- Terisi via JS -->
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="students-grid">
      <div class="col-span-full text-center py-10 text-on-surface-variant bg-surface-container rounded-xl border border-surface-container-high">
        Pilih ujian untuk mulai memantau.
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script>
  <script>
    let pollInterval = null;

    async function loadExams() {
      const exams = await API.call('adminExams');
      const select = document.getElementById('select-exam');
      exams.filter(e => e.status === 'published' || e.status === 'live').forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id; opt.textContent = e.name;
        select.appendChild(opt);
      });
    }

    window.startMonitoring = (examId) => {
      if(pollInterval) clearInterval(pollInterval);
      if(!examId) {
        document.getElementById('students-grid').innerHTML = `<div class="col-span-full text-center py-10 text-on-surface-variant">Pilih ujian.</div>`;
        document.getElementById('monitoring-stats').innerHTML = '';
        return;
      }
      
      const fetchMonitor = async () => {
        try {
          const data = await API.call('adminMonitoring', { examId });
          
          document.getElementById('monitoring-stats').innerHTML = `
            <div class="bg-surface-container p-4 rounded-xl border border-surface-container-high">
              <div class="text-xs text-on-surface-variant uppercase font-bold mb-1">Total Peserta</div>
              <div class="font-display text-2xl font-bold">${data.total}</div>
            </div>
            <div class="bg-surface-container p-4 rounded-xl border border-surface-container-high">
              <div class="text-xs text-on-surface-variant uppercase font-bold mb-1 text-tertiary">Mengerjakan</div>
              <div class="font-display text-2xl font-bold text-tertiary">${data.active}</div>
            </div>
            <div class="bg-surface-container p-4 rounded-xl border border-surface-container-high">
              <div class="text-xs text-on-surface-variant uppercase font-bold mb-1 text-primary">Selesai</div>
              <div class="font-display text-2xl font-bold text-primary">${data.submitted}</div>
            </div>
            <div class="bg-surface-container p-4 rounded-xl border border-surface-container-high">
              <div class="text-xs text-on-surface-variant uppercase font-bold mb-1 text-error">Pelanggaran</div>
              <div class="font-display text-2xl font-bold text-error">${data.students.reduce((acc, s) => acc + s.violationCount, 0)}</div>
            </div>
          `;

          const grid = document.getElementById('students-grid');
          if (data.students.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-10 text-on-surface-variant">Belum ada siswa yang login.</div>`; return;
          }

          grid.innerHTML = data.students.map(s => {
            let color = 'border-surface-container-high';
            let statusText = 'Aktif';
            let statusColor = 'text-tertiary';
            if (s.status === 'submitted') { color = 'border-primary/50'; statusText = 'Selesai'; statusColor = 'text-primary'; }
            else if (s.status === 'locked') { color = 'border-error/50'; statusText = 'Terkunci'; statusColor = 'text-error'; }
            else if (s.secondsLeft <= 0) { color = 'border-secondary/50'; statusText = 'Waktu Habis'; statusColor = 'text-secondary'; }

            return `
              <div class="bg-surface-container p-4 rounded-xl border ${color}">
                <div class="flex justify-between items-start mb-2">
                  <div class="font-bold text-sm truncate pr-2">${s.name}</div>
                  <div class="text-[10px] font-bold uppercase ${statusColor}">${statusText}</div>
                </div>
                <div class="text-xs text-on-surface-variant mb-3">Sisa Waktu: <strong class="${s.secondsLeft <= 300 ? 'text-error' : 'text-on-surface'}">${App.fmtDuration(s.secondsLeft)}</strong></div>
                <div class="flex justify-between items-center text-xs">
                  <span class="${s.violationCount > 0 ? 'text-error font-bold' : 'text-on-surface-variant'}">${s.violationCount} Pelanggaran</span>
                </div>
              </div>
            `;
          }).join('');
        } catch(e) { console.error(e); }
      };

      fetchMonitor();
      pollInterval = setInterval(fetchMonitor, 10000); // 10 detik
    };

    (async () => {
      const user = await API.requireAuth();
      if (user.role !== 'admin' && user.role !== 'guru') { location.href = '../index.html'; return; }
      loadExams();
    })();
  </script>
</body>
</html>
