<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Dashboard Admin — CBT Online</title>
  <link rel="stylesheet" href="../assets/css/tokens.css"/><link rel="stylesheet" href="../assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { background: "#0b1326", surface: "#0b1326", "surface-container-lowest": "#060e20", "surface-container-low": "#131b2e", "surface-container": "#171f33", "surface-container-high": "#222a3d", "on-surface": "#dae2fd", "on-surface-variant": "#c2c6d6", primary: "#adc6ff", "on-primary": "#002e6a", secondary: "#a4c9ff", tertiary: "#4edea3", error: "#ffb4ab" }, fontFamily: { display: ["Space Grotesk"], body: ["Atkinson Hyperlegible Next"] } } } }</script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen antialiased">
  <!-- Header & Nav -->
  <header class="fixed top-0 w-full h-16 bg-surface-container-lowest border-b border-surface-container-high z-50 flex items-center justify-between px-6">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[28px]">admin_panel_settings</span>
        <span class="font-display font-bold text-lg tracking-tight">CBT Admin</span>
      </div>
      <nav class="hidden md:flex gap-4" id="nav-links">
        <a href="dashboard.html" class="text-sm font-bold text-primary">Dashboard</a>
        <a href="bank-soal.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Bank Soal</a>
        <a href="ujian.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Ujian</a>
        <a href="hasil.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Hasil</a>
        <a href="monitoring.html" class="text-sm font-bold text-on-surface-variant hover:text-on-surface transition">Monitoring</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-right hidden sm:block">
        <div class="text-sm font-bold" data-user-name>...</div>
        <div class="text-xs text-on-surface-variant" data-user-role></div>
      </div>
      <button onclick="Auth.logout()" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-error/20 hover:text-error transition"><span class="material-symbols-outlined text-[18px]">logout</span></button>
    </div>
  </header>

  <main class="pt-24 px-6 pb-12 max-w-6xl mx-auto">
    <h1 class="font-display text-3xl font-bold mb-2">Selamat Datang, <span data-user-name>...</span> 👋</h1>
    <p class="text-on-surface-variant mb-8">Berikut adalah ringkasan sistem CBT Anda hari ini.</p>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8" data-stats-container>
      <div class="animate-pulse bg-surface-container h-28 rounded-xl"></div>
      <div class="animate-pulse bg-surface-container h-28 rounded-xl"></div>
      <div class="animate-pulse bg-surface-container h-28 rounded-xl"></div>
      <div class="animate-pulse bg-surface-container h-28 rounded-xl"></div>
    </div>

    <!-- Exam List Quick View -->
    <h2 class="font-display text-xl font-bold mb-4">Ujian Terbaru</h2>
    <div class="bg-surface-container rounded-xl border border-surface-container-high overflow-hidden" data-exams-container>
      <div class="animate-pulse bg-surface-container-low h-20 border-b border-surface-container-high"></div>
      <div class="animate-pulse bg-surface-container-low h-20"></div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script>
  <script>
    (async () => {
      try {
        const user = await API.requireAuth();
        if (user.role !== 'admin' && user.role !== 'guru') { location.href = '../index.html'; return; }
        App.bindUserInfo(user);

        // Load Stats
        const stats = await API.call('adminStats');
        document.querySelector('[data-stats-container]').innerHTML = `
          <div class="bg-surface-container p-5 rounded-xl border border-surface-container-high">
            <div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-on-surface-variant uppercase">Total Siswa</span><span class="material-symbols-outlined text-primary">group</span></div>
            <div class="font-display text-3xl font-bold">${stats.students}</div>
          </div>
          <div class="bg-surface-container p-5 rounded-xl border border-surface-container-high">
            <div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-on-surface-variant uppercase">Total Ujian</span><span class="material-symbols-outlined text-secondary">assignment</span></div>
            <div class="font-display text-3xl font-bold">${stats.totalExams}</div>
          </div>
          <div class="bg-surface-container p-5 rounded-xl border border-surface-container-high">
            <div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-on-surface-variant uppercase">Sesi Aktif</span><span class="material-symbols-outlined text-tertiary animate-pulse">sensors</span></div>
            <div class="font-display text-3xl font-bold text-tertiary">${stats.activeSessions}</div>
          </div>
          <div class="bg-surface-container p-5 rounded-xl border border-surface-container-high">
            <div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-on-surface-variant uppercase">Rata-rata Nilai</span><span class="material-symbols-outlined text-primary-container">analytics</span></div>
            <div class="font-display text-3xl font-bold">${stats.avgScore}</div>
          </div>
        `;

        // Load Recent Exams
        const exams = await API.call('adminExams');
        const c = document.querySelector('[data-exams-container]');
        if (exams.length === 0) {
          c.innerHTML = `<div class="p-6 text-center text-on-surface-variant">Belum ada ujian dibuat.</div>`;
        } else {
          c.innerHTML = exams.slice(0, 5).map(e => `
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border-b border-surface-container-high last:border-0 hover:bg-surface-container-high transition">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-2 h-2 rounded-full ${e.status === 'live' ? 'bg-tertiary' : 'bg-outline'}"></span>
                  <span class="font-bold">${e.name}</span>
                </div>
                <div class="text-xs text-on-surface-variant">${e.subject} • ${e.duration} Menit • Token: ${e.token}</div>
              </div>
              <div class="mt-3 sm:mt-0 flex gap-2">
                <span class="px-3 py-1 bg-surface-container-lowest rounded text-xs font-bold uppercase">${e.status}</span>
                <span class="px-3 py-1 bg-surface-container-lowest rounded text-xs font-bold text-primary">${e.questionCount} Soal</span>
              </div>
            </div>
          `).join('');
        }
      } catch (e) { App.toast(e.message, 'error'); }
    })();
  </script>
</body>
</html>
