<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Dashboard Siswa — CBT Online</title>
  <link rel="stylesheet" href="assets/css/tokens.css"/><link rel="stylesheet" href="assets/css/custom.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { background: "#0b1326", surface: "#0b1326", "surface-container-lowest": "#060e20", "surface-container-low": "#131b2e", "surface-container": "#171f33", "surface-container-high": "#222a3d", "on-surface": "#dae2fd", "on-surface-variant": "#c2c6d6", primary: "#adc6ff", "on-primary": "#002e6a", secondary: "#a4c9ff", tertiary: "#4edea3", error: "#ffb4ab" }, fontFamily: { display: ["Space Grotesk"], body: ["Atkinson Hyperlegible Next"] } } } }</script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen antialiased">
  <header class="fixed top-0 w-full h-16 bg-surface/90 backdrop-blur-xl border-b border-surface-container-high z-50 flex items-center justify-between px-6">
    <div class="flex items-center gap-3"><span class="material-symbols-outlined text-primary text-[28px]">school</span><span class="font-display font-bold text-lg tracking-tight">CBT Online</span></div>
    <div class="flex items-center gap-4">
      <div class="text-right hidden sm:block"><div class="text-sm font-bold" data-user-name>...</div><div class="text-xs text-on-surface-variant" data-user-email></div></div>
      <button onclick="Auth.logout()" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-error/20 hover:text-error transition"><span class="material-symbols-outlined text-[18px]">logout</span></button>
    </div>
  </header>
  <main class="pt-24 px-6 pb-12 max-w-4xl mx-auto space-y-8">
    <div><h1 class="font-display text-3xl font-bold">Halo, <span data-user-name>...</span> 👋</h1><p class="text-on-surface-variant mt-1">Berikut adalah daftar ujian Anda hari ini.</p></div>
    <section>
      <div class="flex items-center gap-2 mb-4"><span class="material-symbols-outlined text-primary">assignment</span><h2 class="font-display text-xl font-semibold">Ujian Aktif</h2></div>
      <div data-exam-list class="space-y-4"><div class="animate-pulse bg-surface-container h-24 rounded-xl"></div></div>
    </section>
    <section>
      <div class="flex items-center gap-2 mb-4"><span class="material-symbols-outlined text-secondary">history</span><h2 class="font-display text-xl font-semibold">Riwayat Ujian</h2></div>
      <div data-history-list class="space-y-3"><div class="animate-pulse bg-surface-container h-16 rounded-xl"></div></div>
    </section>
  </main>
  <script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
  <script>
    (async () => {
      try {
        const user = await API.requireAuth(); App.bindUserInfo(user);
        renderExams(await API.call('listExams')); renderHistory(await API.call('listMyResults'));
      } catch (e) { if (e.message !== 'No session') App.toast('Gagal memuat data: ' + e.message, 'error'); }
      function renderExams(exams) {
        const c = document.querySelector('[data-exam-list]'); if (!c) return;
        if (!exams || exams.length === 0) { c.innerHTML = `<div class="text-center py-10 bg-surface-container rounded-xl border border-surface-container-high"><span class="material-symbols-outlined text-[48px] text-on-surface-variant opacity-50">event_busy</span><p class="mt-2 text-on-surface-variant">Tidak ada ujian yang tersedia saat ini.</p></div>`; return; }
        c.innerHTML = exams.map(e => `
          <div class="bg-surface-container rounded-xl p-5 border border-surface-container-high flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1"><span class="w-2 h-2 rounded-full ${e.status === 'live' ? 'bg-tertiary animate-pulse' : 'bg-secondary'}"></span><span class="text-xs font-bold uppercase tracking-wider text-on-surface-variant">${e.status}</span></div>
              <h3 class="font-display text-lg font-bold text-on-surface truncate">${e.name}</h3>
              <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-on-surface-variant mt-2"><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">category</span> ${e.subject}</span><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">timer</span> ${e.duration} Menit</span></div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              ${e.mySession && e.mySession.status === 'active' ? `<button onclick="startExam('${e.id}')" class="bg-tertiary text-on-tertiary font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 hover:brightness-110 transition"><span class="material-symbols-outlined text-[20px]">play_arrow</span> Lanjutkan</button>` : e.canStart ? `<button onclick="startExam('${e.id}')" class="bg-primary text-on-primary font-bold px-6 py-2.5 rounded-lg flex items-center gap-2 hover:brightness-110 transition"><span class="material-symbols-outlined text-[20px]">edit_document</span> Kerjakan</button>` : `<span class="text-on-surface-variant text-sm bg-surface-container-high px-4 py-2 rounded-lg">Selesai</span>`}
            </div>
          </div>`).join('');
      }
      function renderHistory(h) {
        const c = document.querySelector('[data-history-list]'); if (!c) return;
        if (!h || h.length === 0) { c.innerHTML = `<p class="text-sm text-on-surface-variant italic">Belum ada riwayat pengerjaan.</p>`; return; }
        c.innerHTML = h.map(x => `
          <div class="bg-surface-container rounded-lg p-4 border border-surface-container-high flex justify-between items-center">
            <div><div class="font-bold text-on-surface">${x.examName}</div><div class="text-xs text-on-surface-variant mt-1">${App.fmtDate(x.submittedAt || x.startTime)}</div></div>
            <div class="text-right">${x.total !== null ? `<div class="font-display text-2xl font-bold ${x.total >= 75 ? 'text-tertiary' : 'text-error'}">${App.fmt(x.total)}</div><div class="text-[10px] uppercase tracking-wider font-bold ${x.pendingEssays > 0 ? 'text-secondary' : 'text-on-surface-variant'}">${x.pendingEssays > 0 ? x.pendingEssays + ' Essay Pending' : 'Lengkap'}</div>` : `<div class="text-sm text-on-surface-variant">Belum dinilai</div>`}</div>
          </div>`).join('');
      }
      window.startExam = async (examId) => {
        const token = prompt('Masukkan token ujian (6 karakter):'); if (!token) return;
        try { App.loading(true, 'Menyiapkan ruang ujian...'); const data = await API.call('startExam', { examId, token: token.trim().toUpperCase() }); sessionStorage.setItem('cbt_exam_session', JSON.stringify(data)); location.href = 'exam.html'; }
        catch (e) { App.loading(false); App.toast(e.message, 'error', 4000); }
      };
    })();
  </script>
</body>
</html>
